name: vizarno
services:
  db:
    image: postgres:18-alpine
    ports:
      - "127.0.0.1:55436:5432"
    environment:
      POSTGRES_USER: vizarno
      POSTGRES_DB: vizarno
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vizarno_local}
    volumes:
      - vizarno_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vizarno -d vizarno"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-2.5-sunburst}
      DATABASE_URL: "host=db port=5432 user=vizarno dbname=vizarno sslmode=disable"
      PGPASSWORD: ${POSTGRES_PASSWORD:-vizarno_local}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:5188:8080"
volumes:
  vizarno_data:


